<!doctype html><html><head><meta charset="UTF-8"><title>Production World rover visual fixture</title><style>
html,body{margin:0;background:#17231b;color:white;font:12px monospace}nav{display:flex;gap:5px;flex-wrap:wrap;padding:6px;max-width:1180px}button,select{font:12px sans-serif}#viewport{overflow:hidden}canvas{display:block}#status{white-space:pre-wrap;max-width:1200px}#diagnostics{white-space:pre-wrap;max-height:260px;overflow:auto;font-size:10px}
</style></head><body><nav><label>Heading <select id="heading"></select></label><label>Palette <select id="palette"></select></label><label>Cargo <select id="cargo"><option>0</option><option>10</option><option>20</option></select></label><button id="grid">Eight palettes</button><button id="single">Single rover</button><button id="overlap">Overlapping rovers</button><button id="forward">Forward</button><button id="reverse">Reverse</button><button id="idle">Idle</button><button id="lateral">Lateral</button><button id="steer">Steer</button><button id="reduced">Reduced effects</button><button id="boost">Toggle boost</button><button id="remove">Remove</button><button id="reconnect">Reconnect/reset</button><button id="timings">Measure 90 RAF intervals</button></nav><div id="viewport"></div><div id="status">Loading production World…</div><pre id="diagnostics"></pre><script type="module">
import Phaser from 'phaser';import {World} from './src/world.ts';
const q=new URLSearchParams(location.search),width=Number(q.get('w'))||390,height=Number(q.get('h'))||844;
const paletteColors=['#38bdf8','#fb7185','#a78bfa','#facc15','#34d399','#fb923c','#e879f9','#cbd5e1'];
let boosted=false;let heading=Number(q.get('heading'))||0,palette=Number(q.get('palette'))||0,cargo=Number(q.get('cargo'))||0,grid=q.get('grid')==='1',removed=false,tick=0,running=false,current=[],motion=[],raf=[];
const fallback=q.get('fallback')==='1';let overlap=q.get('overlap')==='1';
class VerificationWorld extends World {create(){super.create();onReady();}preload(){if(!fallback){super.preload();return;}const json=this.load.json;this.load.json=function(key,...args){return key==='rover-v3-manifest'?this:json.call(this,key,...args)};super.preload();this.load.json=json;}}
const world=new VerificationWorld();const game=new Phaser.Game({type:Phaser.AUTO,parent:'viewport',width,height,backgroundColor:'#17231b',scene:[world],audio:{noAudio:true},render:{preserveDrawingBuffer:true}});
const report={method:'Actual production World, synthetic states; fixed Phaser canvas dimensions, not browser viewport emulation',width,height,fallback,motion,raf,errors:[]};
window.addEventListener('error',e=>report.errors.push(e.message));
function player(i,x=0,y=0,angle=heading*Math.PI/8){return {id:'p'+i,name:'Palette '+i,color:paletteColors[i],x,y,angle,cargo,score:0,cooldown:0,boost:boosted?1:0,energy:0.5,stun:0,hitSeq:0,pickupSeq:0,connected:true};}
function players(){return removed?[]:overlap?[{...player(0),id:'p0'},player(1,0,20)]:grid?paletteColors.map((_,i)=>player(i,(i%4-1.5)*190,(Math.floor(i/4)-.5)*230)):[{...player(palette),id:'p0'}];}
function state(){return {type:'state',serverTime:++tick*50,roundId:1,phase:'playing',remaining:120,players:current.map(p=>({...p})),batteries:[],stations:[{x:q.get('station')==='1'?120:300,y:q.get('station')==='1'?0:300,r:65}],radius:520,vehicleScale:1,collisionRadius:25};}
function set(reset=false){if(!world.g)return;const s=state();if(reset)world.resetStateBaseline(s);else world.state=s;}
function refresh(){current=players();set(true);motion.length=0;dump();}
function rasterFootprint(){const sources=new Map();const all=world.textures.getTextureKeys().map(key=>({key,texture:world.textures.get(key)}));world.children.list.forEach((child,i)=>{if(child.texture)all.push({key:'scene-child-'+i,texture:child.texture})});for(const {key,texture} of all){const im=texture.getSourceImage();if(!im||!Number.isFinite(im.width)||!Number.isFinite(im.height))continue;const existing=sources.get(im);if(existing)existing.keys.push(key);else sources.set(im,{keys:[key],width:im.width,height:im.height,rgbaBytes:im.width*im.height*4});}return [...sources.values()];}
function inspect(){return {...report,rasterTextures:rasterFootprint(),heading,palette,cargo,grid,overlap,boosted,removed,stationRadius:65,reducedEffects:world.reducedEffects,diagnostics:world.vehicleDiagnostics,sprites:[...world.sprites].map(([id,s])=>({id,texture:s.texture.key,frame:s.frame.name,pixelWidth:s.frame.realWidth,pixelHeight:s.frame.realHeight,displayWidth:s.displayWidth,displayHeight:s.displayHeight,x:s.x,y:s.y,depth:s.depth,angle:s.rotation,visible:s.visible,hasMask:!!s.mask,isCropped:!!s.isCropped,cropWidth:s._crop?.width,cropHeight:s._crop?.height})),textures:world.textures.getTextureKeys().filter(k=>k.includes('rover-v3')).map(key=>{const im=world.textures.get(key).getSourceImage();return {key,width:im.width,height:im.height,rgbaBytes:im.width*im.height*4}})};}
function dump(){if(!world.g)return;const data=inspect();document.querySelector('#status').textContent=JSON.stringify({canvas:[width,height],browserViewport:[innerWidth,innerHeight],heading,palette,cargo,grid,fallback,ready:data.diagnostics.roverV3?.ready,motionSamples:motion.length,rafSamples:raf.length,errors:report.errors});document.querySelector('#diagnostics').textContent=JSON.stringify(data,null,2);}
function move(mode){if(running)return;grid=false;overlap=false;removed=false;refresh();running=true;let frame=0;const timer=setInterval(()=>{const d=frame*5;current=[{...player(palette,mode==='forward'?d:mode==='reverse'?-d:0,mode==='lateral'?d:0,mode==='steer'?frame*.045:0),id:'p0'}];set();motion.push({mode,frame,diagnostics:world.vehicleDiagnostics});frame++;dump();if(frame>=16){clearInterval(timer);running=false;dump();}},80);}
for(let i=0;i<16;i++)document.querySelector('#heading').add(new Option(String(i),String(i)));
for(let i=0;i<8;i++)document.querySelector('#palette').add(new Option(paletteColors[i],String(i)));
for(const [id,value] of [['heading',heading],['palette',palette],['cargo',cargo]])document.querySelector('#'+id).value=String(value);
document.querySelector('#heading').onchange=e=>{heading=Number(e.target.value);refresh()};document.querySelector('#palette').onchange=e=>{palette=Number(e.target.value);refresh()};document.querySelector('#cargo').onchange=e=>{cargo=Number(e.target.value);refresh()};
for(const mode of ['forward','reverse','idle','lateral','steer'])document.querySelector('#'+mode).onclick=()=>move(mode);
document.querySelector('#grid').onclick=()=>{grid=true;overlap=false;refresh()};document.querySelector('#single').onclick=()=>{grid=false;overlap=false;refresh()};document.querySelector('#overlap').onclick=()=>{grid=false;overlap=true;refresh()};document.querySelector('#remove').onclick=()=>{removed=true;refresh()};document.querySelector('#reconnect').onclick=()=>{removed=false;refresh()};document.querySelector('#boost').onclick=()=>{boosted=!boosted;refresh()};document.querySelector('#reduced').onclick=()=>{world.reducedEffects=!world.reducedEffects;set();dump()};
document.querySelector('#timings').onclick=()=>{raf.length=0;let last=performance.now();function sample(now){raf.push(now-last);last=now;if(raf.length<90)requestAnimationFrame(sample);else dump();}requestAnimationFrame(sample)};
function onReady(){world.self='p0';world.diagnostics=true;refresh();setInterval(()=>{if(!running)set();dump()},100);}
</script></body></html>
