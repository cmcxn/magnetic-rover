name: magnetic-rover
services:
  game:
    image: magnetic-rover:skynet-runtime-f1baee5
    build: .
    ports:
      - "${ROVER_PORT:-18080}:18080"
    environment:
      ROVER_VEHICLE_SCALE: "${ROVER_VEHICLE_SCALE:-0.8}"
      ROVER_BOOST_MULTIPLIER: "${ROVER_BOOST_MULTIPLIER:-1.5}"
      ROVER_BOOST_COOLDOWN: "${ROVER_BOOST_COOLDOWN:-3}"
      ROVER_BOOST_DURATION: "${ROVER_BOOST_DURATION:-1.3}"
      ROVER_MAP_SCALE: "${ROVER_MAP_SCALE:-2}"
      ROVER_SUPPLY_SPEED: "${ROVER_SUPPLY_SPEED:-2}"
      ROVER_BASE_SPEED: "${ROVER_BASE_SPEED:-360}"
    runtime: runc
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
